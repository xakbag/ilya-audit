<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Журнал работ — Дом 2</title>
<style>
:root{--bg1:#faf8f3;--bg2:#f5e8d0;--bg3:#e8f3f0;--card:rgba(255,252,248,.75);--solid:#fffcf8;--tx:#28231e;--mut:#6b5f54;--bd:rgba(60,50,30,.12);--y:#f6c945;--ac:#b8872e;--onac:#fff;--hi:#e5484d;--mid:#e59a00;--low:#30a46c;--ok:#30a46c;--bad:#e5484d;--warn:#b26a00;--chip:rgba(60,50,30,.08);--or:#e8811a;--bl:#5b8def;--sh:0 10px 40px rgba(60,50,10,.12);--font-base:ui-rounded,"SF Pro Rounded","Segoe UI Variable",system-ui,sans-serif;--font-display:Georgia,"Times New Roman",serif;--obj-d2:#c2834e;--obj-sk:#5b8def;--obj-p2:#30a46c;--obj-p3:#e59a00}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg1:#1a1614;--bg2:#2b2416;--bg3:#1a2420;--card:rgba(36,32,28,.75);--solid:#252018;--tx:#f2ede8;--mut:#a89f94;--bd:rgba(255,245,230,.1);--ac:#e5b84f;--onac:#1a1614;--warn:#f0b04a;--chip:rgba(255,245,230,.09);--sh:0 10px 40px rgba(0,0,0,.4);--obj-d2:#d49a68;--obj-sk:#7ba5f5;--obj-p2:#4abe82;--obj-p3:#f0b04a}}
:root[data-theme=dark]{--bg1:#1a1614;--bg2:#2b2416;--bg3:#1a2420;--card:rgba(36,32,28,.75);--solid:#252018;--tx:#f2ede8;--mut:#a89f94;--bd:rgba(255,245,230,.1);--ac:#e5b84f;--onac:#1a1614;--warn:#f0b04a;--chip:rgba(255,245,230,.09);--sh:0 10px 40px rgba(0,0,0,.4)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--tx);font:clamp(14px,3vw,15px)/1.5 var(--font-base);background:radial-gradient(1100px 600px at 90% -10%,var(--bg2),transparent 60%),radial-gradient(700px 500px at 55% 35%,rgba(246,201,69,.12),transparent 70%),radial-gradient(900px 520px at -10% 25%,var(--bg3),transparent 60%),var(--bg1);background-attachment:fixed}
.w{max-width:1000px;margin:0 auto;padding:14px 16px 70px}
.g{background:var(--card);border:1px solid var(--bd);border-radius:24px;box-shadow:var(--sh);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);position:relative}
.g::before{content:'';position:absolute;inset:0;border-radius:24px;background:repeating-linear-gradient(45deg,transparent,transparent 2px,rgba(255,255,255,.02) 2px,rgba(255,255,255,.02) 4px);pointer-events:none;opacity:.5}
header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between;margin:4px 0 12px}
#hi{color:var(--mut);font-size:13px}#hi b{display:block;color:var(--tx);font-size:13px;font-weight:500}
h1{font:clamp(26px,5vw,32px)/1.15 var(--font-display);margin:2px 0 0;letter-spacing:-.01em;color:#1a1410;display:flex;align-items:center;gap:10px}
h1 svg{width:32px;height:32px;flex:none}
h1[data-obj="Дом 2"]{color:var(--obj-d2)}
h1[data-obj="Сколково"]{color:var(--obj-sk)}
h1[data-obj="Переделкино-2"]{color:var(--obj-p2)}
h1[data-obj="Переделкино-3"]{color:var(--obj-p3)}
:root[data-theme=dark] h1,:root:not([data-theme=light]) h1{color:#f5c563}
:root[data-theme=dark] h1[data-obj="Дом 2"],:root:not([data-theme=light]) h1[data-obj="Дом 2"]{color:var(--obj-d2)}
:root[data-theme=dark] h1[data-obj="Сколково"],:root:not([data-theme=light]) h1[data-obj="Сколково"]{color:var(--obj-sk)}
:root[data-theme=dark] h1[data-obj="Переделкино-2"],:root:not([data-theme=light]) h1[data-obj="Переделкино-2"]{color:var(--obj-p2)}
:root[data-theme=dark] h1[data-obj="Переделкино-3"],:root:not([data-theme=light]) h1[data-obj="Переделкино-3"]{color:var(--obj-p3)}
:root[data-theme=dark] #loginBox h2,:root:not([data-theme=light]) #loginBox h2{color:#f5c563}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--solid);border:1px solid var(--bd);border-radius:999px;padding:8px 16px}
textarea{border-radius:16px;resize:vertical}
button{cursor:pointer;transition:background .2s,transform .1s,box-shadow .2s;min-height:48px}button:hover{box-shadow:0 2px 8px rgba(0,0,0,.08)}button:active{transform:scale(.97)}
button.on{background:var(--ac);color:var(--onac);border-color:var(--ac)}
:focus-visible{outline:2px solid var(--y);outline-offset:3px;border-radius:4px}
.sum{display:grid;grid-template-columns:minmax(200px,1fr) 2fr;gap:14px;padding:14px;margin:0 0 12px}
.gauge{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;padding:4px 0}
.gauge svg{width:100%;max-width:210px}
.gb{stroke:var(--chip)}.gf{stroke:var(--y);transition:stroke-dasharray .5s}
.gauge b{font-size:34px;margin-top:8px;letter-spacing:-.02em}.gauge span{color:var(--mut);font-size:12px;margin-top:6px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{text-align:left;border-radius:18px;padding:10px 12px;background:var(--solid);display:flex;flex-direction:column;gap:2px;min-height:86px}
.kpi b{font-size:26px;line-height:1.1;letter-spacing:-.02em}.kpi span{color:var(--mut);font-size:12px}
.kpi.on span{color:inherit;opacity:.8}
.mb{display:block;height:5px;border-radius:99px;background:var(--chip);margin-top:auto;overflow:hidden}.mb i{display:block;height:100%;background:var(--y);border-radius:99px}
.tabs{display:inline-flex;gap:4px;padding:4px;margin:0 0 10px;border-radius:99px}.tabs button{border:0;background:transparent}.tabs button.on{background:var(--ac)}
.stk{position:sticky;top:6px;z-index:5;padding:10px;margin-bottom:6px}
.fl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.fl input{grid-column:1/-1}
#chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.c{position:relative;overflow:hidden;margin:10px 0;border-radius:24px}
.c::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:transparent;border-radius:24px 0 0 24px}
.c.p-high::before{background:var(--hi)}.c.p-mid::before{background:var(--mid)}.c.p-low::before{background:var(--low)}
.c>summary{list-style:none;cursor:pointer;padding:14px 16px 14px 20px;display:flex;gap:6px 10px;flex-wrap:wrap;align-items:center}
.c>summary::-webkit-details-marker{display:none}
.id{font-weight:700;font-size:13px;background:var(--chip);border-radius:999px;padding:3px 10px}
.t{flex:1 1 240px;font-weight:500}.z{color:var(--mut);font-size:13px}
.bs{display:flex;flex-wrap:wrap;gap:4px}
.b{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--chip);white-space:nowrap}
.b.buy{color:var(--warn)}.b.q{color:var(--bad)}.b.late{background:var(--bad);color:#fff}.b.done{color:var(--ok)}
.b.pr.p-high{background:var(--hi);color:#fff}.b.pr.p-mid{background:var(--mid);color:#fff}.b.pr.p-low{background:var(--low);color:#fff}
.b.s1{background:rgba(246,201,69,.35)}.b.s2{background:var(--ok);color:#fff}.b.ed{color:var(--mut);font-style:italic}
.dn{margin-left:auto;font-size:13px;padding:7px 14px;white-space:nowrap;min-height:48px}
.dn.on{background:var(--ok);border-color:var(--ok);color:#fff}
@media(prefers-reduced-motion:no-preference){.dn.on{animation:doneCheck .4s ease-out}}
@keyframes doneCheck{0%{transform:scale(1.1)}50%{transform:scale(.95)}100%{transform:scale(1)}}
.c.s-done{opacity:.72}.c.s-done .t{text-decoration:line-through;text-decoration-color:var(--mut)}
.c.s-late:not(.p-high)::before{background:var(--bad)}
.bd{padding:6px 16px 14px 18px;border-top:1px solid var(--bd);display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 16px}
.bd dl{margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:4px 16px}
.bd dt{color:var(--mut);font-size:12px}.bd dd{margin:0 0 4px}
.wide{grid-column:1/-1}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.pp{min-height:38px;padding:6px 14px}
.pp.on.p-high{background:var(--hi);border-color:var(--hi);color:#fff}.pp.on.p-mid{background:var(--mid);border-color:var(--mid);color:#fff}.pp.on.p-low{background:var(--low);border-color:var(--low);color:#fff}
.pp.p-high:not(.on){color:var(--hi)}.pp.p-mid:not(.on){color:var(--mid)}.pp.p-low:not(.on){color:var(--low)}
.acts{display:flex;flex-wrap:wrap;gap:8px}.acts button{min-height:40px}
.note{font-size:12px;color:var(--mut);margin:6px 0}
.ml{display:flex;flex-direction:column;gap:6px;margin-top:4px}.mr{display:flex;gap:6px;align-items:center}.mr .mn{flex:1;min-width:0}.mr select{font-size:13px;padding:4px 6px}.mr .mx{padding:4px 9px}.mr.s1 .mn{color:var(--warn)}.mr.s2 .mn{color:var(--ok)}.ma2{display:flex;gap:6px;margin-top:6px}.ma2 input{flex:1;min-width:0}
.note.pend{background:#fff3c4;color:#5c4400;border:1px solid #e6c34a;border-radius:12px;padding:6px 10px;font-size:13px}
.gh{display:flex;justify-content:space-between;align-items:baseline;margin:22px 4px 4px;font-weight:600;font-size:16px}
.gh span{color:var(--mut);font-size:13px;font-weight:400}
#v2{padding:14px}
table{width:100%;border-collapse:collapse}td,th{padding:8px 6px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
.cp{width:100%;min-height:44px;margin:8px 0;background:var(--ac);color:var(--onac);border-color:var(--ac)}
.hid{display:none!important}
#foot{display:none}#foot.show{display:block}.info{float:right;margin-top:14px}
dialog{border:1px solid var(--bd);border-radius:28px;padding:0;width:min(720px,94vw);max-height:90vh;background:var(--solid);color:var(--tx);box-shadow:0 24px 80px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(20,20,10,.4);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
dialog form{display:flex;flex-direction:column;max-height:90vh}
dialog h2{margin:0;padding:18px 24px 10px;font-size:20px;font-weight:600}
.mf{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px 16px;padding:10px 24px;overflow:auto}
.ff{display:flex;flex-direction:column;gap:5px}.ff label,.ff .lb{font-size:12px;color:var(--mut);font-weight:500}
.ff input:not([type=checkbox]),.ff select,.ff textarea{width:100%;border-radius:14px;min-height:48px;padding:10px 14px}
.ff .cbx{display:flex;gap:8px;align-items:center;font-size:15px;color:var(--tx);min-height:48px}
.ff input[type=checkbox]{width:22px;height:22px;cursor:pointer}
.rs{align-self:flex-start;font-size:12px;padding:3px 11px;color:var(--mut)}
.ma{display:flex;gap:10px;justify-content:flex-end;padding:14px 24px 18px;border-top:1px solid var(--bd)}
.pri{background:var(--ac);color:var(--onac);border-color:var(--ac);font-weight:600}
#toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,140%);display:flex;gap:12px;align-items:center;background:var(--ac);color:var(--onac);padding:10px 16px;border-radius:99px;box-shadow:var(--sh);transition:transform .25s;z-index:20;max-width:92vw}
#toast.show{transform:translate(-50%,0)}#toast button{background:transparent;color:inherit;border-color:currentColor;padding:4px 12px}
@media(max-width:700px){.sum{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){button,select,input{min-height:48px;font-size:16px}textarea{font-size:16px}h1{font-size:clamp(20px,5vw,24px)}.c>summary{padding:14px 14px 14px 18px}.dn{margin-left:0;font-size:14px}}
@media print{.row2,.stk,#chips,.tabs,#th,#lang,.dn,.acts,.pills,#info,dialog,#toast{display:none!important}body{background:#fff;color:#000}.g{box-shadow:none;backdrop-filter:none;background:#fff}.c{break-inside:avoid}}

#loginScreen{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:var(--bg1);backdrop-filter:blur(8px)}
#loginBox{background:var(--solid);border:1px solid var(--bd);border-radius:28px;padding:36px 40px;width:min(400px,92vw);box-shadow:var(--sh)}
#loginBox h2{font:clamp(22px,4vw,26px)/1.2 var(--font-display);margin:0 0 24px;text-align:center;color:#1a1410}
#loginBox input{width:100%;margin-bottom:14px;border-radius:16px;min-height:52px;padding:12px 18px;font-size:16px}
#loginBox button{width:100%;min-height:52px;margin-top:10px;font-size:16px;font-weight:600}
#loginError{color:var(--bad);font-size:13px;margin:10px 0 0;text-align:center;min-height:18px}
#objSwitch{display:flex;gap:6px;padding:5px;border-radius:999px;background:var(--chip);margin-right:8px}
#objSwitch button{border:0;background:transparent;padding:8px 14px;font-size:13px;min-height:38px;font-weight:500;display:flex;align-items:center;gap:6px}
#objSwitch button svg{width:16px;height:16px;flex:none;opacity:.7}
#objSwitch button.on{background:var(--solid);box-shadow:0 2px 6px rgba(0,0,0,.08)}
#objSwitch button.on svg{opacity:1}
[data-obj="Дом 2"] svg{fill:var(--obj-d2)}
[data-obj="Сколково"] svg{fill:var(--obj-sk)}
[data-obj="Переделкино-2"] svg{fill:var(--obj-p2)}
[data-obj="Переделкино-3"] svg{fill:var(--obj-p3)}
#logout{font-size:13px;padding:8px 14px;margin-left:4px;min-height:38px}

body{background:radial-gradient(1100px 600px at 90% -10%,var(--bg2),transparent 60%),radial-gradient(700px 500px at 55% 35%,rgba(246,201,69,.16),transparent 70%),radial-gradient(900px 520px at -10% 25%,var(--bg3),transparent 60%),var(--bg1);background-attachment:fixed}
.gauge path{stroke-linecap:butt}.gauge path.gb{stroke-linecap:round}
.gd{stroke:var(--ok)}.gw{stroke:var(--or)}.gn{stroke:var(--bl)}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;flex:none}.dot.gd{background:var(--ok)}.dot.gw{background:var(--or)}.dot.gn{background:var(--bl)}
.glg{list-style:none;margin:10px 0 0;padding:0;width:100%;max-width:230px;font-size:12px;text-align:left}.glg li{display:flex;align-items:center;padding:4px 0;border-top:1px dashed var(--bd)}.glg b{margin-left:auto;font-size:12px;margin-top:0}
.kh{display:flex;justify-content:space-between;align-items:center;gap:6px;color:var(--mut);font-size:12px}
.kpi.on .kh{color:inherit;opacity:.85}
.bdg{font-style:normal;font-size:11px;padding:1px 7px;border-radius:99px;background:rgba(48,164,108,.15);color:var(--ok);white-space:nowrap}
.kpi.on .bdg{background:rgba(255,255,255,.2);color:inherit}
.sp{display:flex;align-items:flex-end;gap:3px;height:26px;margin-top:auto}.sp i{flex:1;background:var(--tx);opacity:.75;border-radius:2px}.sp i.z0{opacity:.15}
.kpi.on .sp i{background:var(--onac)}
.row2{display:grid;grid-template-columns:3fr 2fr;gap:12px;margin:0 0 12px}
.pan{padding:14px 16px}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:12px}.ph b{font-size:15px}.ph span{color:var(--mut);font-size:12px}
.segs{display:flex;flex-wrap:wrap;gap:12px 6px}
.sg{flex:var(--n) 1 0;min-width:86px;display:flex;flex-direction:column;gap:5px}
.sb{display:flex;gap:2px;height:30px}.sb i{flex:1;border-radius:4px;background:var(--bl);opacity:.3}.sb i.k1{background:var(--or);opacity:1}.sb i.k2{background:var(--ok);opacity:1}
.sg span{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sg span b{color:var(--tx);font-weight:600}
.lgd{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:14px;font-size:12px;color:var(--mut);align-items:center}
.tw{max-height:290px;overflow:auto;margin:0 -4px}
#team td,#team th{padding:7px 4px;font-size:13px;vertical-align:middle}#team th{color:var(--mut);font-weight:500;font-size:12px;position:sticky;top:0;background:var(--solid)}
#team td.n{text-align:right;font-variant-numeric:tabular-nums;color:var(--mut)}
.lnk{border:0;background:none;padding:0;text-align:left;font-weight:500;border-radius:6px}.lnk:hover{text-decoration:underline}
.st{font-size:11px;padding:2px 9px;border-radius:99px;white-space:nowrap}.st.ok{background:rgba(48,164,108,.15);color:var(--ok)}.st.bad{background:rgba(229,72,77,.14);color:var(--bad)}.st.w{background:rgba(240,138,36,.16);color:var(--or)}.st.n{background:var(--chip);color:var(--mut)}
tr.sel td{background:rgba(246,201,69,.18)}
@media(max-width:800px){.row2{grid-template-columns:1fr}}
@media(max-width:600px){.lnk{min-height:0;font-size:14px}}
</style>
</head>

<div id="loginBox">

</div>
</div>

 <div class="stk g"><div class="fl">

 </div>

async function uploadPhoto(taskId,file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=async()=>{
      const img=new Image();
      img.onload=async()=>{
        const canvas=document.createElement('canvas');
        let w=img.width,h=img.height;
        const maxDim=1600;
        if(w>maxDim||h>maxDim){
          if(w>h){h=Math.round(h*maxDim/w);w=maxDim;}
          else{w=Math.round(w*maxDim/h);h=maxDim;}
        }
        canvas.width=w;canvas.height=h;
        const ctx=canvas.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        const base64=canvas.toDataURL('image/jpeg',0.8).split(',')[1];
        try{
          const r=await fetch(API+'?action=upload_photo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({task_id:taskId,data:base64})});
          const d=await r.json();
          if(!r.ok||!d.ok)reject(new Error(d.error||'Upload failed'));
          else resolve(d.photo);
        }catch(e){reject(e);}
      };
      img.onerror=()=>reject(new Error('Invalid image'));
      img.src=reader.result;
    };
    reader.onerror=()=>reject(new Error('Cannot read file'));
    reader.readAsDataURL(file);
  });
}

async function checkSession(){
  try{const r=await fetch(API+'?action=check_session',{cache:'no-store'});
  if(r.ok){const d=await r.json();if(d.ok){sessionUser=d.user;sessionRole=d.role||'admin';return true}}
  }catch(_){}
  return false;
}
async function doLogin(user,pass){
  try{const r=await fetch(API+'?action=login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:user,password:pass})});
  const d=await r.json();
  if(r.status===401)return{ok:false,error:t('loginError')};
  if(r.status===429)return{ok:false,error:t('loginAttempts')};
  if(!r.ok||!d.ok)return{ok:false,error:'Ошибка входа'};
  sessionUser=d.user;sessionRole=d.role||'admin';return{ok:true};
  }catch(_){return{ok:false,error:'Нет связи с сервером'};}
}
async function doLogout(){
