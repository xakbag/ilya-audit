*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(1100px 600px at 90% -10%,var(--bg2),transparent 60%),radial-gradient(900px 520px at -10% 25%,var(--bg3),transparent 60%),var(--bg1);background-attachment:fixed}
.w{max-width:1000px;margin:0 auto;padding:14px 16px 70px}
.g{background:var(--card);border:1px solid var(--bd);border-radius:22px;box-shadow:var(--sh);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between;margin:4px 0 12px}
#hi{color:var(--mut);font-size:13px}#hi b{display:block;color:var(--tx);font-size:13px;font-weight:500}
h1{font-size:26px;line-height:1.15;margin:2px 0 0;letter-spacing:-.01em}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--solid);border:1px solid var(--bd);border-radius:99px;padding:7px 14px}
textarea{border-radius:14px;resize:vertical}
button{cursor:pointer;transition:background .15s,transform .1s}button:active{transform:scale(.97)}
button.on{background:var(--ac);color:var(--onac);border-color:var(--ac)}
:focus-visible{outline:2px solid var(--y);outline-offset:2px}
.sum{display:grid;grid-template-columns:minmax(200px,1fr) 2fr;gap:14px;padding:14px;margin:0 0 12px}
.gauge{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;padding:4px 0}
.gauge svg{width:100%;max-width:210px}.gauge path{fill:none;stroke-width:12;stroke-linecap:round}
.gb{stroke:var(--chip)}.gf{stroke:var(--y);transition:stroke-dasharray .5s}
.gauge b{font-size:34px;margin-top:-46px;letter-spacing:-.02em}.gauge span{color:var(--mut);font-size:12px;margin-top:6px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{text-align:left;border-radius:18px;padding:10px 12px;background:var(--solid);display:flex;flex-direction:column;gap:2px;min-height:86px}
.kpi b{font-size:26px;line-height:1.1;letter-spacing:-.02em}.kpi span{color:var(--mut);font-size:12px}
.kpi.on span{color:inherit;opacity:.8}
.mb{display:block;height:5px;border-radius:99px;background:var(--chip);margin-top:auto;overflow:hidden}.mb i{display:block;height:100%;background:var(--y);border-radius:99px}
.tabs{display:inline-flex;gap:4px;padding:4px;margin:0 0 10px;border-radius:99px}.tabs button{border:0;background:transparent}.tabs button.on{background:var(--ac)}
.stk{position:sticky;top:6px;z-index:5;padding:10px;margin-bottom:6px}
.fl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.fl input{grid-column:1/-1}
#chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.c{position:relative;overflow:hidden;margin:10px 0;border-radius:20px}
.c::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:transparent}
.c.p-high::before{background:var(--hi)}.c.p-mid::before{background:var(--mid)}.c.p-low::before{background:var(--low)}
.c>summary{list-style:none;cursor:pointer;padding:12px 14px 12px 18px;display:flex;gap:6px 10px;flex-wrap:wrap;align-items:center}
.c>summary::-webkit-details-marker{display:none}
.id{font-weight:700;font-size:13px;background:var(--chip);border-radius:99px;padding:2px 9px}
.t{flex:1 1 240px;font-weight:500}.z{color:var(--mut);font-size:13px}
.bs{display:flex;flex-wrap:wrap;gap:4px}
.b{font-size:12px;padding:2px 9px;border-radius:99px;background:var(--chip);white-space:nowrap}
.b.buy{color:var(--warn)}.b.q{color:var(--bad)}.b.late{background:var(--bad);color:#fff}.b.done{color:var(--ok)}
.b.pr.p-high{background:var(--hi);color:#fff}.b.pr.p-mid{background:var(--mid);color:#fff}.b.pr.p-low{background:var(--low);color:#fff}
.b.s1{background:rgba(246,201,69,.35)}.b.s2{background:var(--ok);color:#fff}.b.ed{color:var(--mut);font-style:italic}
.dn{margin-left:auto;font-size:13px;padding:6px 12px;white-space:nowrap}
.dn.on{background:var(--ok);border-color:var(--ok);color:#fff}
.c.s-done{opacity:.72}.c.s-done .t{text-decoration:line-through;text-decoration-color:var(--mut)}
.c.s-late:not(.p-high)::before{background:var(--bad)}
.bd{padding:6px 16px 14px 18px;border-top:1px solid var(--bd);display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 16px}
.bd dl{margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:4px 16px}
.bd dt{color:var(--mut);font-size:12px}.bd dd{margin:0 0 4px}
.wide{grid-column:1/-1}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.pp{min-height:38px;padding:6px 14px}
.pp.on.p-high{background:var(--hi);border-color:var(--hi);color:#fff}.pp.on.p-mid{background:var(--mid);border-color:var(--mid);color:#fff}.pp.on.p-low{background:var(--low);border-color:var(--low);color:#fff}
.pp.p-high:not(.on){color:var(--hi)}.pp.p-mid:not(.on){color:var(--mid)}.pp.p-low:not(.on){color:var(--low)}
.acts{display:flex;flex-wrap:wrap;gap:8px}.acts button{min-height:40px}
.note{font-size:12px;color:var(--mut);margin:6px 0}
.note.pend{background:#fff3c4;color:#5c4400;border:1px solid #e6c34a;border-radius:12px;padding:6px 10px;font-size:13px}
.gh{display:flex;justify-content:space-between;align-items:baseline;margin:22px 4px 4px;font-weight:600;font-size:16px}
.gh span{color:var(--mut);font-size:13px;font-weight:400}
#v2{padding:14px}
table{width:100%;border-collapse:collapse}td,th{padding:8px 6px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
.cp{width:100%;min-height:44px;margin:8px 0;background:var(--ac);color:var(--onac);border-color:var(--ac)}
.hid{display:none!important}
#foot{display:none}#foot.show{display:block}.info{float:right;margin-top:14px}
dialog{border:1px solid var(--bd);border-radius:24px;padding:0;width:min(720px,94vw);max-height:90vh;background:var(--solid);color:var(--tx);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(20,20,10,.35);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
dialog form{display:flex;flex-direction:column;max-height:90vh}
dialog h2{margin:0;padding:16px 20px 8px;font-size:18px}
.mf{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 14px;padding:8px 20px;overflow:auto}
.ff{display:flex;flex-direction:column;gap:4px}.ff label,.ff .lb{font-size:12px;color:var(--mut)}
.ff input:not([type=checkbox]),.ff select,.ff textarea{width:100%;border-radius:12px}
.ff .cbx{display:flex;gap:8px;align-items:center;font-size:15px;color:var(--tx);min-height:40px}
.ff input[type=checkbox]{width:20px;height:20px}
.rs{align-self:flex-start;font-size:12px;padding:2px 10px;color:var(--mut)}
.ma{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px 16px;border-top:1px solid var(--bd)}
.pri{background:var(--ac);color:var(--onac);border-color:var(--ac)}
#toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,140%);display:flex;gap:12px;align-items:center;background:var(--ac);color:var(--onac);padding:10px 16px;border-radius:99px;box-shadow:var(--sh);transition:transform .25s;z-index:20;max-width:92vw}
#toast.show{transform:translate(-50%,0)}#toast button{background:transparent;color:inherit;border-color:currentColor;padding:4px 12px}

.gauge path{stroke-linecap:butt}.gauge path.gb{stroke-linecap:round}

.bdg{font-style:normal;font-size:11px;padding:1px 7px;border-radius:99px;background:rgba(48,164,108,.15);color:var(--ok);white-space:nowrap}

.sp{display:flex;align-items:flex-end;gap:3px;height:26px;margin-top:auto}.sp i{flex:1;background:var(--tx);opacity:.75;border-radius:2px}.sp i.z0{opacity:.15}
.kpi.on .sp i{background:var(--onac)}
.row2{display:grid;grid-template-columns:3fr 2fr;gap:12px;margin:0 0 12px}
.pan{padding:14px 16px}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:12px}.ph b{font-size:15px}.ph span{color:var(--mut);font-size:12px}
.segs{display:flex;flex-wrap:wrap;gap:12px 6px}
.sg{flex:var(--n) 1 0;min-width:86px;display:flex;flex-direction:column;gap:5px}
.sb{display:flex;gap:2px;height:30px}.sb i{flex:1;border-radius:4px;background:var(--bl);opacity:.3}.sb i.k1{background:var(--or);opacity:1}.sb i.k2{background:var(--ok);opacity:1}
.sg span{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sg span b{color:var(--tx);font-weight:600}
.lgd{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:14px;font-size:12px;color:var(--mut);align-items:center}
.tw{max-height:290px;overflow:auto;margin:0 -4px}
#team td,#team th{padding:7px 4px;font-size:13px;vertical-align:middle}#team th{color:var(--mut);font-weight:500;font-size:12px;position:sticky;top:0;background:var(--solid)}
#team td.n{text-align:right;font-variant-numeric:tabular-nums;color:var(--mut)}
.lnk{border:0;background:none;padding:0;text-align:left;font-weight:500;border-radius:6px}.lnk:hover{text-decoration:underline}
.st{font-size:11px;padding:2px 9px;border-radius:99px;white-space:nowrap}.st.ok{background:rgba(48,164,108,.15);color:var(--ok)}.st.bad{background:rgba(229,72,77,.14);color:var(--bad)}.st.w{background:rgba(240,138,36,.16);color:var(--or)}.st.n{background:var(--chip);color:var(--mut)}
tr.sel td{background:rgba(246,201,69,.18)}
@media(max-width:800px){.row2{grid-template-columns:1fr}}
@media(max-width:600px){.lnk{min-height:0;font-size:14px}}
</style>

 if(undo)$('tu').onclick=()=>{undo();el.classList.remove('show')};el.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),6000)}

function openEd(id){cur=id;const x=byId(id);$('mt').textContent=t('editT')+' '+id;
 $('mf').innerHTML=EF.map(([f,lk,ty])=>{const v=get(x,f)??'',e='e_'+f;let inp;

  else if(ty==='cb')inp='<label class="cbx"><input type="checkbox" id="'+e+'"'+(String(v)==='True'?' checked':'')+'> '+t('buy')+'</label>';
  else inp='<input id="'+e+'" type="'+(ty||'text')+'" value="'+esc(v)+'"'+(ty?'':' list="dl_'+f+'"')+'>'+(ty?'':'<datalist id="dl_'+f+'">'+uniq(f).map(a=>'<option value="'+esc(a)+'">').join('')+'</datalist>');
  const lab=ty==='cb'?'<span class="lb">'+t(lk)+'</span>':'<label for="'+e+'">'+t(lk)+'</label>';
  const r=isEd(id,f)?'<button type="button" class="rs" data-rf="'+f+'">↺ '+t('orig')+'</button>':'';
  return '<div class="ff'+(ty==='ta'?' wide':'')+'">'+lab+inp+r+'</div>'}).join('');
 $('dlg').showModal();$('e_task').focus()}

 $('dlg').close();refresh();toast(t('saved'),restore(id,prev))};

 if(d.done){e.preventDefault();const x=byId(d.done);if(get(x,'status')==='Выполнена')setSt(d.done,x.status!=='Выполнена'?x.status:'В работе');else setSt(d.done,'Выполнена');return}
 if(d.pr!==undefined){const[id,p]=d.pr.split('|');setF(id,'priority',p);refresh();return}
 if(d.st){const[id,s]=d.st.split('|');setSt(id,s);return}
 if(d.edit){openEd(d.edit);return}

$('info').onclick=()=>$('foot').classList.toggle('show');

let recog;
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(/Mac/.test(navigator.userAgent)&&'ontouchend' in document);
$('addTask').onclick=()=>$('newTaskDlg').showModal();

$('voiceBtn').onclick=()=>{
 if(isIOS){$('taskInput').focus();$('voiceStatus').textContent='Нажмите 🎤 на клавиатуре';setTimeout(()=>$('voiceStatus').textContent='',4000);return}
 if(!('webkitSpeechRecognition' in window||'SpeechRecognition' in window)){$('voiceStatus').textContent='⚠ Голосовой ввод недоступен';return}
 if(!recog){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;recog=new SR();recog.lang='ru-RU';recog.continuous=false;recog.interimResults=false;
  recog.onstart=()=>$('voiceStatus').textContent='🎤 Слушаю...';
  recog.onresult=e=>{const txt=e.results[0][0].transcript;$('taskInput').value=txt;$('voiceStatus').textContent='✓ Распознано'};
  recog.onerror=e=>$('voiceStatus').textContent='⚠ Ошибка: '+e.error;
  recog.onend=()=>{if($('voiceStatus').textContent==='🎤 Слушаю...')$('voiceStatus').textContent=''}}
 try{recog.start()}catch(e){$('voiceStatus').textContent='⚠ '+e.message}};
$('ntf').onsubmit=e=>{e.preventDefault();const txt=$('taskInput').value.trim();if(!txt){alert('Введите описание задачи');return}
 const nextId='D2-'+String(Math.max(0,...T.map(x=>+(/(\d+)$/.exec(x.task_id)||[0,0])[1]))+1).padStart(3,'0');const parsed=parseTaskInput(txt);
 const newTask={task_id:nextId,object:'Дом 2',floor_zone:parsed.zone||'',room:parsed.room||'',category:parsed.category||'',task:parsed.task||txt,task_type:parsed.type||'',responsible:parsed.responsible||'',executor:parsed.executor||parsed.responsible||'',materials_status:parsed.materials||'',purchase_required:'False',purchase_item_or_action:'',status:'Новая',priority:parsed.priority||'',deadline:parsed.deadline||'',comment:'',pending:false,uz:{}};
 T.push(newTask);if(online)push({nt:[newTask]});else{NT.push(newTask);saveNT()}refresh();$('newTaskDlg').close();$('taskInput').value='';$('voiceStatus').textContent='';toast('Задача '+nextId+' создана')};
function parseTaskInput(txt){const t=txt.toLowerCase(),res={};
 if(/высок/i.test(txt))res.priority='Высокий';else if(/средн/i.test(txt))res.priority='Средний';else if(/низк/i.test(txt))res.priority='Низкий';
 const exm=/исполнитель\s+([а-яё]+)/i.exec(txt);if(exm)res.executor=exm[1].charAt(0).toUpperCase()+exm[1].slice(1);
 const rpm=/ответственн[а-яё]*\s+([а-яё]+)/i.exec(txt);if(rpm)res.responsible=rpm[1].charAt(0).toUpperCase()+rpm[1].slice(1);
 const zm=/(\d)\s*эт/i.exec(txt);if(zm)res.zone=zm[1]+' этаж';
 const rm=/(прихож|гостин|кухн|санузел|спальн|ванн|коридор|кабинет|терраса|гараж|подвал|чердак)/i.exec(txt);if(rm){const rn={'прихож':'Прихожая','гостин':'Гостиная','кухн':'Кухня','санузел':'Санузел','спальн':'Спальня','ванн':'Ванная','коридор':'Коридор','кабинет':'Кабинет','терраса':'Терраса','гараж':'Гараж','подвал':'Подвал','чердак':'Чердак'};res.room=rn[rm[1].toLowerCase()]}
 const dm=/(\d{1,2})\.(\d{1,2})\.?(\d{2,4})?/i.exec(txt);if(dm){const d=dm[1].padStart(2,'0'),m=dm[2].padStart(2,'0'),y=dm[3]?dm[3]:'2026';res.deadline=(y.length===2?'20'+y:y)+'-'+m+'-'+d}
 const cat=/(зеркал|освещен|электр|сантехн|мебел|двер|окн|пол|потолок|стен|покрас|плитк|обои|кондиционер)/i.exec(txt);
 if(cat){const cm={'зеркал':'Зеркала','освещен':'Освещение','электр':'Электрика','сантехн':'Сантехника','мебел':'Мебель','двер':'Двери','окн':'Окна','пол':'Полы','потолок':'Потолки','стен':'Стены','покрас':'Покраска','плитк':'Плитка','обои':'Обои','кондиционер':'Кондиционеры'};res.category=cm[cat[1].toLowerCase()]||cat[1]}
 const ty=/(монтаж|установ|покрас|отделк|ремонт|замен|провер|наладк|чист|уборк)/i.exec(txt);
 if(ty){const tm={'монтаж':'Монтаж','установ':'Установка','покрас':'Покраска','отделк':'Отделка','ремонт':'Ремонт','замен':'Замена','провер':'Проверка','наладк':'Наладка','чист':'Чистка','уборк':'Уборка'};res.type=tm[ty[1].toLowerCase()]||ty[1]}
 res.task=txt.replace(/исполнитель\s+[а-яё]+/gi,'').replace(/ответственн[а-яё]*\s+[а-яё]+/gi,'').replace(/высок[а-яё]* приоритет/gi,'').replace(/средн[а-яё]* приоритет/gi,'').replace(/низк[а-яё]* приоритет/gi,'').replace(/(до|срок)?\s*\d{1,2}\.\d{1,2}\.?\d{0,4}/gi,'').replace(/\s*,(\s*,)+/g,',').replace(/[\s,.;]+$/,'').replace(/\s+/g,' ').trim();
 return res}
